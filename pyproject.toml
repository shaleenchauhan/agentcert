[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcert"
version = "0.2.0"
description = "Bitcoin-anchored identity certificates for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Shaleen Chauhan" },
]
keywords = ["bitcoin", "ai", "identity", "certificates", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=42.0",
    "requests>=2.31",
    "click>=8.1",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.1.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "responses>=0.24",
]

[project.scripts]
agentcert = "agentcert.cli:cli"

[project.urls]
Homepage = "https://github.com/shaleenchauhan/agentcert"
Documentation = "https://github.com/shaleenchauhan/agentcert#readme"
Repository = "https://github.com/shaleenchauhan/agentcert"
Issues = "https://github.com/shaleenchauhan/agentcert/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
