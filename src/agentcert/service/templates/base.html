<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} — AgentCert</title>
    <link rel="stylesheet" href="/dashboard/static/style.css">
</head>
<body>
    <nav class="nav">
        <a href="/dashboard" class="nav-brand">AgentCert</a>
        <ul class="nav-links">
            <li><a href="/dashboard" class="{{ 'active' if active_page == 'overview' else '' }}">Overview</a></li>
            <li><a href="/dashboard/agents" class="{{ 'active' if active_page == 'agents' else '' }}">Agents</a></li>
            <li><a href="/dashboard/entries" class="{{ 'active' if active_page == 'entries' else '' }}">Entries</a></li>
            <li><a href="/dashboard/batches" class="{{ 'active' if active_page == 'batches' else '' }}">Batches</a></li>
            <li><a href="/dashboard/verify" class="{{ 'active' if active_page == 'verify' else '' }}">Verify</a></li>
        </ul>
        <div class="nav-health">
            <span class="health-dot"></span>
            Service Health
        </div>
    </nav>

    <div class="container">
        {% if explainer_text %}
        <div class="explainer-wrapper">
            <button class="explainer-btn" id="explainer-toggle" aria-expanded="false" aria-controls="explainer-panel">? What am I looking at?</button>
            <div class="explainer-panel" id="explainer-panel" hidden>
                <div class="explainer-body">
                    <p>{{ explainer_text }}</p>
                </div>
                <button class="explainer-dismiss" id="explainer-dismiss">Got it</button>
            </div>
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        AgentCert v{{ version }} — Bitcoin-anchored identity certificates for AI agents
    </footer>

    <script src="/dashboard/static/main.js"></script>
</body>
</html>
