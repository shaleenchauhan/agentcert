version: "3.8"

services:
  agentcert:
    build: .
    container_name: agentcert-service
    restart: unless-stopped
    volumes:
      - agentcert-data:/data
    environment:
      - AGENTCERT_DB_PATH=/data/agentcert.db
      - AGENTCERT_BATCH_INTERVAL=600
      - AGENTCERT_NETWORK=testnet
      - AGENTCERT_HOST=0.0.0.0
      - AGENTCERT_PORT=8932
    expose:
      - "8932"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8932/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: agentcert-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./static:/var/www/static:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - agentcert

  certbot:
    image: certbot/certbot
    container_name: agentcert-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --webroot -w /var/www/certbot --quiet; done'"

volumes:
  agentcert-data:
  certbot-etc:
  certbot-var:
  certbot-webroot:
