[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcert-middleware"
version = "0.1.0"
description = "Shared middleware base for AgentCert framework integrations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Shaleen Chauhan", email = "shaleen@agentcert.dev" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "agentcert>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "responses>=0.24",
]

[project.urls]
Homepage = "https://github.com/shaleenchauhan/agentcert"
Repository = "https://github.com/shaleenchauhan/agentcert/tree/main/packages/agentcert-middleware"
Documentation = "https://agentcert.dev"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcert_middleware"]
